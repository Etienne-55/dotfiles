set -g default-terminal "tmux-256color"
# -g, not -ag: appending grows the list on every `prefix r` re-source
# no DECSLRM (Cmg/Clmg/Dsmg/Enmg, left/right scroll margins): WezTerm garbles the other
# nvim split when tmux scrolls just one vertical split with them; repaint lines instead
set -g terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB,*:Cmg@:Clmg@:Dsmg@:Enmg@"
set -g focus-events on # nvim FocusLost/FocusGained (screensaver pauses when you leave nvim)

set -g prefix C-b
unbind C-a
bind-key C-b send-prefix

# Cmd++ (ghostty): split, new pane to the right, in the same directory
unbind |
bind % split-window -h -c "#{pane_current_path}"

# Cmd+- (ghostty): split, new pane below, in the same directory
unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# Cmd+d (ghostty): delete pane, no y/n confirm
bind x kill-pane
# Cmd+Shift+d (ghostty): delete window, no y/n confirm
bind X kill-window

# Cmd+s (ghostty): new window in the same directory
bind c new-window -c "#{pane_current_path}"
# Cmd+a / Cmd+Shift+a (ghostty): next / previous window (p is the claude popup)
bind n next-window
bind N previous-window

# windows and panes count from 1 so Cmd+1..9 (ghostty) match; no gaps after closing one
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# window names are icon + name:  claude (nf-cod-claude; its process is named after its version,
# e.g. 2.1.309),  nvim/vim,  shell (zsh), 󰊢 git/lazygit,  htop/btop, 󰣀 ssh,
# 󰎙 node, python; anything else shows only its command name
set -g automatic-rename on
set -g automatic-rename-format '#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}}, claude,#{?#{m/r:^n?vim?$,#{pane_current_command}}, #{pane_current_command},#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}}, #{s/^-//:pane_current_command},#{?#{m/r:^(lazygit|git|tig)$,#{pane_current_command}},󰊢 #{pane_current_command},#{?#{m/r:^(htop|btop|top)$,#{pane_current_command}}, #{pane_current_command},#{?#{m/r:^ssh$,#{pane_current_command}},󰣀 #{pane_current_command},#{?#{m/r:^(node|npm|pnpm|bun)$,#{pane_current_command}},󰎙 #{pane_current_command},#{?#{m/r:^python[0-9.]*$,#{pane_current_command}}, #{pane_current_command},#{pane_current_command}}}}}}}}}'

# Cmd+r (ghostty): reload this file (and the ghostty config)
unbind r
bind r source-file ~/.tmux.conf

# Cmd+arrows (ghostty) move between panes and nvim splits via vim-tmux-navigator;
# Cmd+Shift+arrows resize
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5
bind H resize-pane -L 5

# zoom the pane (toggle); Cmd+Backspace (ghostty) does the same via tmux's default z
bind -r m resize-pane -Z

bind M-c attach-session -c "#{pane_current_path}"

set -g mouse on

# ghostty's ghost (+boo) after 20 min with no keys typed in tmux; q brings the panes back.
# Skipped when the current window has nvim open: zone.nvim is the screensaver there.
# The zsh TMOUT version in zshrc only runs outside tmux.
set -g lock-after-time 1200
set -g lock-command "tmux list-panes -F '#{pane_current_command}' | grep -qx nvim || /Applications/Ghostty.app/Contents/MacOS/ghostty +boo"

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

bind-key -r i run-shell "tmux neww ~/.tmux-cht.sh"
# bind-key -r e run-shell "tmux neww ~/programming/Gomodoro/run_gomodoro.sh"

# prefix + Space: hex, a cheat sheet of every binding in this config (nvim, tmux, zsh) in a floating popup (replaces tmux's next-layout); q closes it.
# bg=terminal: the real terminal bg, so the popup is as see-through as the panes ("default" would use popup-style)
bind-key Space display-popup -E -b rounded -s bg=terminal -S 'fg=#2c6b45' -w 80% -h 80% "~/dotfiles/tools/hex/hex --popup"

# prefix + v or Cmd+z (ghostty): nvim in a new window, in the same directory; q on the dashboard closes it
bind-key v new-window -c "#{pane_current_path}" "nvim"

# prefix + t: nyancat in a new window (replaces the default clock-mode); press ctrl-c to quit
unbind t
bind-key t new-window -n nyancat "nyancat"

# prefix + p: floating claude chat for quick questions (runs in ~/.claude-chat, not a repo).
# the session survives closing the popup; prefix + p again inside it hides it.
bind-key p if-shell -F '#{==:#{session_name},claude-chat}' \
  'detach-client' \
  'display-popup -E -w 80% -h 80% -b rounded -T " claude " "mkdir -p ~/.claude-chat && TMUX= tmux new-session -A -s claude-chat -c ~/.claude-chat claude"'

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse

# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 10

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
# set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
# set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
# set -g @plugin 'fabioluciano/tmux-tokyo-night' # powerkit: its pills were too heavy, replaced by the bar below

# glass bar at the bottom (nvim has its own bar on top, extras/tabline.lua): no backgrounds anywhere, so ghostty's background-opacity + macos-glass
# blur shows through, and only the text is colored (Neon, nvim/lua/eti/core/palette.lua)
set -g status-position bottom
set -g status-interval 5
set -g status on
set -g status-justify left
set -g status-style "bg=default,fg=#6B5A8E"
# powerkit set these with pill backgrounds; reset them so a reload clears its leftovers
set -g window-status-style "default"
set -g window-status-current-style "default"
set -g window-status-activity-style "default"
set -g popup-style "default"
set -g menu-style "fg=#DCD3F0"
set -g menu-selected-style "bg=#2E1A4D,fg=#DCD3F0"
set -g pane-border-status off
set -gu status-format
set -gu @_powerkit_left_edge_sep
set -g status-left-length 40
set -g status-right-length 120
# session name: purple, yellow while the prefix is pressed, cyan in copy mode. Unnamed
# sessions (tmux numbers them 0, 1, ...) show a ghost (nf-md-ghost) instead, which keeps the prefix colors
set -g status-left '#[bold]#{?client_prefix,#[fg=#E8D287],#{?pane_in_mode,#[fg=#5CCFD4],#[fg=#A884E8]}} #{?#{m/r:^[0-9]+$,#S},󰊠,#S} #[nobold,fg=#5A4A78]│ '
set -g window-status-separator ""
# every window's icon takes its program's color: claude orange, nvim blue, shell green, git red,
# htop yellow, ssh pink, node dark green, python cyan, anything else white. The selected window
# is the full color and bold, its number lit in the same color; the others are at half
# brightness with a faded number. A half circle after the last window marks the end of the
# list, in that window's color.
set -g window-status-format ' #[fg=#5A4A78]#I #[fg=#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},##774E36,#{?#{m/r:^n?vim?$,#{pane_current_command}},##44446D,#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}},##3A725E,#{?#{m/r:^(lazygit|git|tig)$,#{pane_current_command}},##77344C,#{?#{m/r:^(htop|btop|top)$,#{pane_current_command}},##776A49,#{?#{m/r:^ssh$,#{pane_current_command}},##733E6A,#{?#{m/r:^(node|npm|pnpm|bun)$,#{pane_current_command}},##22534F,#{?#{m/r:^python[0-9.]*$,#{pane_current_command}},##316970,##6B5A8E}}}}}}}}]#W #{?window_end_flag,,}'
# zoomed (focus mode, prefix + z / m) window gets a magnifying glass
set -g window-status-current-format ' #[fg=#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},##E89A62,#{?#{m/r:^n?vim?$,#{pane_current_command}},##8285E0,#{?#{m/r:^-?(zsh|bash|sh|fish)$,#{pane_current_command}},##6FE0B0,#{?#{m/r:^(lazygit|git|tig)$,#{pane_current_command}},##E8668E,#{?#{m/r:^(htop|btop|top)$,#{pane_current_command}},##E8D287,#{?#{m/r:^ssh$,#{pane_current_command}},##E07AC8,#{?#{m/r:^(node|npm|pnpm|bun)$,#{pane_current_command}},##3FA393,#{?#{m/r:^python[0-9.]*$,#{pane_current_command}},##5CCFD4,##DCD3F0}}}}}}}},bold]#I #W#{?window_zoomed_flag, 󰍉,} #{?window_end_flag,,}#[nobold]'
set -g window-status-bell-style "fg=#E8668E"
# right side: only the git branch of the active pane's folder (empty outside a repo)
set -g status-right '#[fg=#6FE0B0] #[fg=#B3A8CC]#(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) '

set -g pane-border-style "fg=#2E2045"
set -g pane-active-border-style "fg=#9677D6"
set -g message-style "bg=default,fg=#DCD3F0"
set -g message-command-style "bg=default,fg=#E8D287"
set -g mode-style "bg=#2E1A4D,fg=#DCD3F0"
set -g popup-border-style "fg=#9677D6"

# the branch segment runs per pane directory: redraw on every pane/window switch so it
# follows you into another worktree right away instead of after status-interval
set-hook -g after-select-pane 'refresh-client -S'
set-hook -g after-select-window 'refresh-client -S'


set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
